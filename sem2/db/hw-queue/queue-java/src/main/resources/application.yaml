spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/autoservice_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin_pass}
    driver-class-name: org.postgresql.Driver

app:
  mode: ${APP_MODE:monitor}
  max-attempts: ${MAX_ATTEMPTS:5}
  producer:
    rate-per-second: ${PRODUCER_RATE:300}
  consumer:
    name: ${CONSUMER_NAME:consumer-1}
    fail-probability: ${FAIL_PROBABILITY:0.15}
    sleep-ms: ${CONSUMER_SLEEP_MS:100}
  monitor:
    interval-ms: ${MONITOR_INTERVAL_MS:5000}
