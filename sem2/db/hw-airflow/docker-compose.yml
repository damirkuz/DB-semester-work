x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9 clickhouse-connect==0.8.14"
    PG_HOST: host.docker.internal
    PG_PORT: "5433"
    PG_DB: autoservice_db
    PG_USER: admin
    PG_PASSWORD: admin_pass
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_PASSWORD: clickhouse
    EXPORT_LIMIT: "50000"
  volumes:
    - .:/opt/airflow/hw
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    clickhouse:
      condition: service_started

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: autoservice_clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  airflow-postgres:
    image: postgres:15
    container_name: autoservice_airflow_metadata
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20
    volumes:
      - airflow_metadata:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: autoservice_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Damir \
          --lastname Kuzdikenov \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: autoservice_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: autoservice_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug

volumes:
  airflow_metadata:
  clickhouse_data:
